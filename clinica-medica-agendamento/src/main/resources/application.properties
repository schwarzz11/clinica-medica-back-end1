
# Configure the database driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Sets the MySQL dialect for Hibernate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
# SQL initialization settings
# Disables automatic schema generation
spring.jpa.hibernate.ddl-auto=update
# Path to the schema SQL file
spring.sql.init.schema-locations=classpath:db/schema.sql
# Path to the data SQL file
spring.sql.init.data-locations=classpath:db/data.sql

# URL base do Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#define o perfil ativo
spring.profiles.active=local



# ==================================
# CONFIGURAÇÕES DO EUREKA CLIENT
# ==================================

# Define o nome que este serviço terá no dashboard do Eureka.
# É importante que seja único e descritivo.
spring.application.name=clinica-medica-agendamento
# Endereço do nosso Servidor Eureka.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==================================
# CONFIGURAÇÕES DO SPRING ACTUATOR
# ==================================

# Expõe os endpoints 'health' e 'info' via web.
management.endpoints.web.exposure.include=health,info,prometheus

# ==========================================================================
# CONFIGURAÇÕES DE SEGURANÇA E JWT (JSON Web Token)
# ==========================================================================
# Chave secreta para assinar os tokens. Use uma chave longa e complexa.
# Você pode gerar uma nova em: https://www.lastpass.com/features/password-generator
application.security.jwt.secret-key=a2c8a7e6f0b3d5e8f1a3b5c7d9e0f2a4b6c8d0e2f1a3b5c7d9e0f2a4b6c8d0e2

# Tempo de expiração do token de acesso (em milissegundos)
# Ex: 1 hora = 3600000
application.security.jwt.expiration=3600000

# Tempo de expiração do refresh token
application.security.jwt.refresh-token.expiration=86400000