version: '3.8'

services:
  # 1. Banco de Dados MySQL (com dados persistentes)
  mysql-db:
    image: mysql:8.0
    container_name: mysql-clinica-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 'clinicamedica'
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      # Expõe a porta 3306 do contêiner para a porta 3306 da sua máquina
      - "3306:3306"
    volumes:
      # Garante que os dados do banco não sejam perdidos ao reiniciar o contêiner
      - mysql-data:/var/lib/mysql

volumes:
  # Define o volume para a persistência dos dados
  mysql-data: