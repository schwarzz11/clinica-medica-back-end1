# ==================================
# CONFIGURAÇÕES DO BANCO DE DADOS (PARA RODAR LOCALMENTE)
# ==================================
spring.datasource.url=jdbc:mysql://localhost:3306/clinicamedica?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================
# CONFIGURAÇÕES DO HIBERNATE
# ==================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# ==================================
# INICIALIZAÇÃO DO BANCO DE DADOS
# ==================================
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# ==================================
# CONFIGURAÇÕES DE SEGURANÇA E JWT (COM NOVA CHAVE)
# ==================================
# NOVA CHAVE SECRETA FORTE E COMPATÍVEL
application.security.jwt.secret-key=pJn+5+sC/t7kU5nE8wX2aVbBq7cH9fYzR6gD3eF4jGk=
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=86400000

# ==================================
# CONFIGURAÇÕES DO EUREKA CLIENT
# ==================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==================================
# CONFIGURAÇÕES DO SPRING ACTUATOR (PARA MONITORAMENTO)
# ==================================
management.endpoints.web.exposure.include=health,info,prometheus