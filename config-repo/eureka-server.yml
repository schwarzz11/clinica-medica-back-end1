spring:
  application:
    name: eureka-server
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
management:
  endpoint:
    health:
      show-details: ALWAYS
logging:
  level:
    com.netflix: INFO
management:
  otlp:
    tracing:
      endpoint: http://localhost:4317
---
spring:
  config:
    activate:
      on-profile: docker
server:
  port: 8761
---
spring:
  config:
    activate:
      on-profile: prod
server:
  port: ${SERVER_PORT:8761}
