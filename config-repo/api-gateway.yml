spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: clinica-medica-administrativo
          uri: lb://clinica-medica-administrativo
          predicates:
            - Path=/administrativo/**
          filters:
            - StripPrefix=1
        - id: clinica-medica-agendamento
          uri: lb://clinica-medica-agendamento
          predicates:
            - Path=/agendamento/**
          filters:
            - StripPrefix=1
        - id: clinica-medica-atendimento
          uri: lb://clinica-medica-atendimento
          predicates:
            - Path=/atendimento/**
          filters:
            - StripPrefix=1
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    org.springframework.cloud.gateway: INFO
management:
  otlp:
    tracing:
      endpoint: http://localhost:4317
---
spring:
  config:
    activate:
      on-profile: local
  redis:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: docker
  redis:
    host: redis
    port: 6379
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: prod
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
server:
  port: ${SERVER_PORT:8080}
