<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Clínica Vida</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrapper">
    <section class="login-hero">
      <img src="img/logo.svg" alt="Clínica Vida" width="140" />
      <h1>Bem-vindo à Área do Colaborador</h1>
      <p>Utilize suas credenciais para acessar o painel administrativo e gerenciar pacientes, convênios e mais.</p>
    </section>
    <section class="login-form">
      <form id="login-form" class="stack">
        <div>
          <h2>Acesse sua conta</h2>
          <p class="text-muted">Informe usuário e senha fornecidos pelo administrador.</p>
        </div>
        <div class="form-group">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" name="usuario" placeholder="seu.usuario" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="********" autocomplete="current-password" required />
        </div>
        <div id="login-feedback"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Entrar</button>
          <a href="index.html" class="btn btn-outline">Voltar ao site</a>
        </div>
      </form>
    </section>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
